spring.application.name=mansys-bigdata
server.port=8080

# ---------- MySQL (the RDBMS we are caching) ----------
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/mansys
spring.datasource.username=root
spring.datasource.password=mysql
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---------- Redis (the cache) ----------
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=redis
# 60000 ms = 60 seconds TTL for every cached entry
spring.cache.redis.time-to-live=60000
spring.cache.redis.cache-null-values=false

# ---------- Hadoop HDFS (document storage) ----------
hdfs.uri=hdfs://127.0.0.1:9000
hdfs.images=/swe307/images

# ---------- Ollama (local LLM) ----------
ollama.url=http://localhost:11434/api/chat
ollama.model=llama3.2

# ---------- Thymeleaf / uploads ----------
spring.thymeleaf.cache=false
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
# Close the DB session when the controller returns, not after the HTML renders.
spring.jpa.open-in-view=false
